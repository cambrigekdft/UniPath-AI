<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniPath AI - 公益升学助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .chat-container { height: calc(100vh - 200px); }
        .typing-dot { animation: typing 1.4s infinite; }
        @keyframes typing { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="text-slate-800">

    <!-- Header -->
    <nav class="sticky top-0 z-50 glass-card px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
            <div class="bg-indigo-600 p-2 rounded-lg shadow-lg">
                <i class="fas fa-graduation-cap text-white text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-xl tracking-tight text-slate-900">UniPath <span class="text-indigo-600">AI</span></h1>
                <p class="text-[10px] text-slate-500 uppercase tracking-widest font-semibold">公益升学咨询平台</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button id="open-settings" class="w-10 h-10 rounded-full hover:bg-slate-100 transition-colors flex items-center justify-center text-slate-500" title="设置 API Key">
                <i class="fas fa-cog"></i>
            </button>
            <div class="text-[10px] text-slate-400 font-bold uppercase hidden sm:block">
                赋能每一位学子的升学之路
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="flex flex-col glass-card rounded-3xl overflow-hidden shadow-2xl relative">
            <div class="bg-gradient-to-r from-slate-800 to-slate-900 px-6 py-4 text-white flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <span class="flex h-2 w-2 rounded-full bg-green-500 animate-pulse"></span>
                    <h2 class="font-bold text-sm">通用咨询终端</h2>
                </div>
                <span class="text-[10px] font-bold uppercase opacity-60">实时联网检索已就绪</span>
            </div>

            <div id="chat-window" class="chat-container overflow-y-auto p-6 md:p-10 space-y-8 bg-white/50">
                <div class="flex gap-4">
                    <div class="w-10 h-10 rounded-2xl bg-slate-800 flex items-center justify-center text-white shadow-lg shrink-0">
                        <i class="fas fa-seedling"></i>
                    </div>
                    <div class="bg-white p-5 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 max-w-[90%]">
                        <p class="text-sm leading-relaxed text-slate-700">
                            你好！这是一个公益性质的 AI 升学助手。
                            <br><br>
                            请点击右上角 <i class="fas fa-cog"></i> 配置你的 Gemini API Key 后，即可开始提问。
                        </p>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-6 bg-white border-t border-slate-100">
                <div class="relative flex items-end gap-3">
                    <div class="flex-1 relative">
                        <textarea id="user-input" rows="1" class="w-full pl-5 pr-14 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all resize-none text-sm font-medium" placeholder="输入你想咨询的内容..."></textarea>
                        <button id="send-btn" class="absolute right-2 bottom-2 p-3 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition-all shadow-lg">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal px-4">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl">
            <h3 class="text-xl font-bold mb-4">API 设置</h3>
            <p class="text-sm text-slate-500 mb-6">请输入你的 Google Gemini API Key。此密钥仅保存在你的浏览器本地，不会被上传到任何服务器。</p>
            <input type="password" id="api-key-input" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl mb-6 outline-none focus:border-indigo-500" placeholder="在此输入 API Key...">
            <div class="flex gap-3">
                <button id="save-settings" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition-colors">保存配置</button>
                <button id="close-settings" class="flex-1 bg-slate-100 text-slate-600 py-3 rounded-xl font-bold hover:bg-slate-200 transition-colors">取消</button>
            </div>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const settingsModal = document.getElementById('settings-modal');
        const apiKeyInput = document.getElementById('api-key-input');

        // 从本地存储加载 API Key
        let currentApiKey = localStorage.getItem('unipath_gemini_key') || "";
        apiKeyInput.value = currentApiKey;

        const systemPrompt = `你是一个公益升学咨询助手。你的目标是帮助学生理解全球申请流程、院校特点和专业选择。排版规则：1. 禁止使用任何多余符号（如连续#）。2. 保持简洁、客观、导师化语气。3. 使用清晰文本段落。`;

        // 弹窗逻辑
        document.getElementById('open-settings').onclick = () => settingsModal.classList.add('active');
        document.getElementById('close-settings').onclick = () => settingsModal.classList.remove('active');
        document.getElementById('save-settings').onclick = () => {
            currentApiKey = apiKeyInput.value.trim();
            localStorage.setItem('unipath_gemini_key', currentApiKey);
            settingsModal.classList.remove('active');
            appendMessage('ai', "API Key 已更新并存储。可以开始对话了！");
        };

        async function callGemini(message) {
            if (!currentApiKey) return "请先点击右上角设置图标配置 API Key。";

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${currentApiKey}`;
            const payload = {
                contents: [{ parts: [{ text: message }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                tools: [{ "google_search": {} }]
            };

            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();
                    if (data.error) throw new Error(data.error.message);
                    return data.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (e) {
                    if (i === 4) return `错误: ${e.message || "请求失败"}`;
                    await new Promise(r => setTimeout(r, Math.pow(2, i) * 1000));
                }
            }
        }

        function appendMessage(role, text) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex gap-4 ${role === 'user' ? 'justify-end' : ''}`;
            const html = role === 'ai' 
                ? `<div class="w-10 h-10 rounded-2xl bg-slate-800 flex items-center justify-center text-white shadow-lg shrink-0"><i class="fas fa-robot"></i></div>
                   <div class="bg-white p-5 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 max-w-[90%] text-sm leading-relaxed text-slate-700">${text.replace(/\n/g, '<br>')}</div>`
                : `<div class="bg-indigo-600 p-5 rounded-2xl rounded-tr-none shadow-lg text-white max-w-[85%] text-sm font-medium leading-relaxed">${text}</div>`;
            wrapper.innerHTML = html;
            chatWindow.appendChild(wrapper);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;
            appendMessage('user', text);
            userInput.value = '';
            
            const typing = document.createElement('div');
            typing.id = 'temp-typing';
            typing.className = 'flex gap-2 text-xs text-slate-400 pl-14 items-center';
            typing.innerHTML = `<span>AI 正在思考</span><span class="typing-dot">.</span><span class="typing-dot">.</span><span class="typing-dot">.</span>`;
            chatWindow.appendChild(typing);
            
            const res = await callGemini(text);
            typing.remove();
            appendMessage('ai', res);
        }

        sendBtn.onclick = handleSend;
        userInput.onkeypress = (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } };
    </script>
</body>
</html>
