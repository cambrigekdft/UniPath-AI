<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniPath AI - 公益升学助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .chat-container { height: calc(100vh - 200px); }
        .typing-dot { animation: typing 1.4s infinite; }
        @keyframes typing { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="text-slate-800">

    <!-- Header -->
    <nav class="sticky top-0 z-50 glass-card px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
            <div class="bg-indigo-600 p-2 rounded-lg shadow-lg">
                <i class="fas fa-graduation-cap text-white text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-xl tracking-tight text-slate-900">UniPath <span class="text-indigo-600">AI</span></h1>
                <p class="text-[10px] text-slate-500 uppercase tracking-widest font-semibold">公益升学咨询平台</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button id="open-settings" class="w-10 h-10 rounded-full hover:bg-slate-100 transition-colors flex items-center justify-center text-slate-500" title="设置 API">
                <i class="fas fa-cog"></i>
            </button>
            <div class="text-[10px] text-slate-400 font-bold uppercase hidden sm:block">
                赋能每一位学子的升学之路
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="flex flex-col glass-card rounded-3xl overflow-hidden shadow-2xl relative">
            <div class="bg-gradient-to-r from-slate-800 to-slate-900 px-6 py-4 text-white flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <span class="flex h-2 w-2 rounded-full bg-green-500 animate-pulse"></span>
                    <h2 class="font-bold text-sm">通用咨询终端</h2>
                </div>
                <span class="text-[10px] font-bold uppercase opacity-60">多协议 API 适配已就绪</span>
            </div>

            <div id="chat-window" class="chat-container overflow-y-auto p-6 md:p-10 space-y-8 bg-white/50">
                <div class="flex gap-4">
                    <div class="w-10 h-10 rounded-2xl bg-slate-800 flex items-center justify-center text-white shadow-lg shrink-0">
                        <i class="fas fa-seedling"></i>
                    </div>
                    <div class="bg-white p-5 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 max-w-[90%]">
                        <p class="text-sm leading-relaxed text-slate-700">
                            你好！这是一个公益性质的 AI 升学助手。
                            <br><br>
                            请点击右上角 <i class="fas fa-cog"></i> 配置你的 API 密钥和接口地址后，即可开始提问。支持官方 Gemini 或兼容 OpenAI 格式的第三方转发。
                        </p>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-6 bg-white border-t border-slate-100">
                <div class="relative flex items-end gap-3">
                    <div class="flex-1 relative">
                        <textarea id="user-input" rows="1" class="w-full pl-5 pr-14 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all resize-none text-sm font-medium" placeholder="输入你想咨询的内容..."></textarea>
                        <button id="send-btn" class="absolute right-2 bottom-2 p-3 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition-all shadow-lg">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal px-4">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl overflow-y-auto max-h-[90vh]">
            <h3 class="text-xl font-bold mb-4">API 进阶设置</h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">API Key</label>
                    <input type="password" id="api-key-input" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-indigo-500" placeholder="sk-...">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">API Endpoint (Base URL)</label>
                    <input type="text" id="api-url-input" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-indigo-500" placeholder="https://generativelanguage.googleapis.com">
                    <p class="text-[10px] text-slate-400 mt-1">留空则默认使用 Google Gemini 官方地址</p>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Model Name</label>
                    <input type="text" id="api-model-input" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-indigo-500" placeholder="gemini-2.5-flash-preview-09-2025">
                </div>
            </div>

            <div class="flex gap-3 mt-8">
                <button id="save-settings" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition-colors">保存配置</button>
                <button id="close-settings" class="flex-1 bg-slate-100 text-slate-600 py-3 rounded-xl font-bold hover:bg-slate-200 transition-colors">取消</button>
            </div>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const settingsModal = document.getElementById('settings-modal');
        
        const apiKeyInput = document.getElementById('api-key-input');
        const apiUrlInput = document.getElementById('api-url-input');
        const apiModelInput = document.getElementById('api-model-input');

        // 初始化配置
        let config = {
            key: localStorage.getItem('unipath_api_key') || "",
            url: localStorage.getItem('unipath_api_url') || "https
